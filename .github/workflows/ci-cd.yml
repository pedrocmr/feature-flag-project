name: CI/CD - Build, testes e dev

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21 e cache do Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testar e empacotar
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar JAR para o deploy
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  deploy-dev:
    name: Deploy simulado em dev
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Baixar o mesmo JAR aprovado no CI
        uses: actions/download-artifact@v4
        with:
          name: application
          path: deploy/dev

      - name: Simular deploy e verificar saúde da aplicação
        run: |
          set -euo pipefail
          jars=(deploy/dev/*.jar)
          test "${#jars[@]}" -eq 1
          echo "Iniciando deploy temporário em dev: ${jars[0]}"
          sha256sum "${jars[0]}" | tee deploy/dev/checksum.txt
          java -jar "${jars[0]}" --server.port=8080 --flags.storage-path=./deploy/dev/data/flags.bin > deploy/dev/application.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health > deploy/dev/health.json; then
              if jq -e '.status == "UP"' deploy/dev/health.json; then
                echo "Deploy simulado concluído e health check aprovado."
                {
                  echo '### Deploy simulado em dev aprovado'
                  echo "Commit: $GITHUB_SHA"
                  echo 'O JAR do build foi iniciado no runner e respondeu UP ao health check.'
                  echo 'A aplicação é encerrada ao final do job; nenhum servidor externo foi alterado.'
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat deploy/dev/application.log
              exit 1
            fi
            sleep 2
          done
          cat deploy/dev/application.log
          echo 'Health check não ficou disponível dentro do prazo.'
          exit 1

      - name: Publicar evidências do deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dev-evidence
          path: |
            deploy/dev/application.log
            deploy/dev/health.json
            deploy/dev/checksum.txt
          if-no-files-found: warn
          retention-days: 7
